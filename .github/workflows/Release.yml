name: Develop
on:
  push:
    branches:
      - develop

env:
  SOLUTION_FILE_PATH: Assignment/ShizukuEngine/ShizukuEngine.slnx

  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-2025-vs2026
    
    steps:
     - name: Checkout
       uses: actions/checkout@v6

     - name: Install Windows SDK 10.0.28000
       shell: pwsh
       run: |
         winget install --id Microsoft.WindowsSDK.10.0.28000 --exact --silent --accept-package-agreements --accept-source-agreements

     - name: Add MSBuild to PATH 
       uses: microsoft/steup-msbuild@v3
       with:
         msbuild-architecture: x64

     - name: Build
       run: | 
        msbuild ${{env.SOLUTION_FILE_PATH}}/ p :Platform-x64,Configuration=${{env.CONFIGURATION}}
