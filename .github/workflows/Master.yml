name: Master
on:
  push:
    branches:
      - Master

env:
  SOLUTION_FILE_PATH: ShizukuEngine.slnx

  CONFIGURATION: Master

jobs:
  build:
    runs-on: windows-2025-vs2026
    
    steps:
     - name: Checkout
       uses: actions/checkout@v6


    #Windows SDK 10.0.28000のインストールを追加
     - name: Install Windows SDK 10.0.28000
       shell: pwsh
       run: |
         winget install --id Microsoft.WindowsSDK.10.0.28000 --exact --silent --accept-package-agreements --accept-source-agreements

     - name: Add MSBuild to PATH 
       uses: microsoft/setup-msbuild@v3
       with:
         msbuild-architecture: x64

     - name: Build
       run: | 
        msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=x64,Configuration=${{env.CONFIGURATION}}
